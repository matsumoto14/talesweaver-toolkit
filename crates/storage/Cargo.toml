[package]
name = "storage"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
domain = { path = "../domain" }
gamedata = { path = "../gamedata" }
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
