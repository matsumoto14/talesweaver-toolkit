# Workers Builds が繋がっている Worker の名前と一致させること。
# ずれていると、ローカルの `wrangler deploy` が別の Worker を新しく作ってしまう。
name = "talesweaver-toolkit"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# 例外のスタックをダッシュボードの Observability から読めるようにする。
# 無いと、原因不明の 500 を推測で追うことになる。
[observability]
enabled = true

# nonce の使用済み記録とレート制限のカウンタ。どちらも TTL 付きの短命なキー。
# 作成: wrangler kv namespace create INQUIRY(または ダッシュボード → Storage & Databases → KV)
# namespace id は秘密情報ではないのでコミットしてよい。`binding` はコード側の名前で、
# namespace の表示名と一致していなくてよい。
[[kv_namespaces]]
binding = "INQUIRY"
id = "3076805c790b44d28b38f9123312d0cd"

[vars]
GITHUB_OWNER = "matsumoto14"
GITHUB_REPO = "talesweaver-toolkit"
# 付けるラベル(リポジトリ側にあらかじめ作っておく)
ISSUE_LABELS = "from-app,unverified"
# App ID と installation id は GitHub App のページで誰でも見られる識別子で、
# 秘密情報ではない(秘密鍵が無ければ何もできない)。手で入れる項目を減らすためここに置く。
GITHUB_APP_ID = "4746900"
GITHUB_INSTALLATION_ID = "157175345"

# シークレット(ダッシュボードの Variables and Secrets、または wrangler secret put。
# ここには書かない):
#   GITHUB_APP_PRIVATE_KEY     GitHub App の秘密鍵(PKCS#8 に変換した PEM 全文)
#   NONCE_SECRET               PoW の nonce に署名する任意の乱数文字列
