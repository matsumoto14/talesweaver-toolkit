name = "tw-toolkit-inquiry"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# nonce の使用済み記録とレート制限のカウンタ。どちらも TTL 付きの短命なキー。
# 作成: wrangler kv namespace create INQUIRY(または ダッシュボード → Storage & Databases → KV)
# namespace id は秘密情報ではないのでコミットしてよい。`binding` はコード側の名前で、
# namespace の表示名と一致していなくてよい。
[[kv_namespaces]]
binding = "INQUIRY"
id = "3076805c790b44d28b38f9123312d0cd"

[vars]
GITHUB_OWNER = "matsumoto14"
GITHUB_REPO = "talesweaver-toolkit"
# 付けるラベル(リポジトリ側にあらかじめ作っておく)
ISSUE_LABELS = "from-app,unverified"

# シークレット(wrangler secret put で入れる。ここには書かない):
#   GITHUB_APP_ID              GitHub App の App ID
#   GITHUB_APP_PRIVATE_KEY     GitHub App の秘密鍵(PKCS#8 PEM 全文)
#   GITHUB_INSTALLATION_ID     このリポジトリへの installation id
#   NONCE_SECRET               PoW の nonce に署名する任意の乱数文字列
