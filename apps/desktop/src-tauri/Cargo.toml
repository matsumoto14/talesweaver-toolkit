[package]
name = "desktop"
version = "0.1.1"
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# 自動更新(お知らせタブから当てる)と、更新後の再起動
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# お知らせの取得。WebView の fetch だと配信元(R2)に CORS 設定が要るので Rust 側から取る
tauri-plugin-http = "2"
serde = { workspace = true }
# tauri.conf.json の plugins セクションを generate_context! が埋め込むのに要る
serde_json = { workspace = true }
domain = { path = "../../../crates/domain" }
gamedata = { path = "../../../crates/gamedata" }
storage = { path = "../../../crates/storage" }
# 保存に触らないコマンドの中身(Web 版と共通)
commands = { path = "../../../crates/commands" }
base64 = "0.22"
