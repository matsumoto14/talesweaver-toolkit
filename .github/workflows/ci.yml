name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Tauri のビルドと同じ土俵で検証する(配布先が Windows のため)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Web 版の道を閉じないための番人(下の wasm ビルドで使う)
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: 依存を入れる
        working-directory: apps/desktop
        run: npm ci

      - name: Rust のテスト
        run: cargo test --workspace

      # 計算(domain / gamedata)はブラウザでも動かせる状態を保つ。OS や DB に依存する
      # コードが混ざるとここで落ちる。保存(crates/storage)は rusqlite なので対象外で、
      # Web 版を出すときは別実装になる(docs/architecture.md)
      - name: 計算部分が wasm でビルドできる
        run: cargo check -p domain -p gamedata --target wasm32-unknown-unknown

      # `cargo fmt --check` / `clippy -D warnings` は既存コードが通らないので入れていない。
      # 入れるなら、まず一括整形の commit を単独で切ること。

      - name: フロントのビルドと型チェック
        working-directory: apps/desktop
        run: |
          npm run build
          npx svelte-check --tsconfig ./tsconfig.json --threshold error
