name: Workers

# services/ 配下の Cloudflare Workers(api-worker = wiki に聞く、inquiry-worker = 問い合わせ)を
# main に push したときに型検査 → テスト → `wrangler deploy` する。手で deploy し忘れて
# 本番が古いままになるのを防ぐ(2026-09-23 に a772971 の修正が本番に乗っていなかった)。
#
# 秘密(ANTHROPIC_API_KEY / NONCE_SECRET)は `wrangler secret put` で入れたものが残るので、
# ここでは触らない。D1 の表(schema.sql / migrations/)も自動では投入しない(手順は各 README)。
# CLOUDFLARE_API_TOKEN は web.yml と同じものを使う。Workers Scripts の編集権限が要る
# (Pages だけのトークンなら「Cloudflare Workers を編集」テンプレートで作り直す)。
on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/workers.yml"
  workflow_dispatch:

concurrency:
  group: workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [api-worker, inquiry-worker]
    defaults:
      run:
        working-directory: services/${{ matrix.worker }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/${{ matrix.worker }}/package-lock.json

      - name: 依存を入れる
        run: npm ci

      - name: 型検査
        run: npm run check

      - name: テスト
        run: npm test

      # 秘密が無いフォーク・環境では検査までで止める(web.yml と同じ流儀)。
      - name: Cloudflare Workers に配る
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
